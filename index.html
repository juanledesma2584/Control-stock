<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Materiales - Edificio 100 Dptos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
    <h1 class="text-xl font-bold">Control de Stock - Obra</h1>
    <p class="text-xs text-blue-100">Gestión de instalaciones eléctricas (100 Departamentos)</p>
  </header>

  <!-- Navegación por pestañas -->
  <nav class="bg-white shadow flex justify-around border-b border-gray-200 text-sm">
    <button id="tab1" onclick="switchTab('config')" class="py-3 px-2 tab-active flex-1 text-center">Planilla / Dpto</button>
    <button id="tab2" onclick="switchTab('uso')" class="py-3 px-2 flex-1 text-center">Reg. Uso</button>
    <button id="tab3" onclick="switchTab('piso')" class="py-3 px-2 flex-1 text-center">Faltantes Piso</button>
    <button id="tab4" onclick="switchTab('global')" class="py-3 px-2 flex-1 text-center">Stock Global</button>
  </nav>

  <main class="p-4 max-w-2xl mx-auto">

    <!-- PANEL 1: Requerimientos por Departamento -->
    <section id="sec-config" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-lg mb-2 text-blue-800">Cómputo por Departamento</h2>
        <p class="text-xs text-gray-500 mb-4">Ingresá la cantidad de insumos que lleva UN departamento tipo:</p>
        
        <div class="grid grid-cols-2 gap-3 text-sm">
          <div>
            <label class="block font-medium">Luces / Picos</label>
            <input type="number" id="req-luces" class="w-full p-2 border rounded mt-1" value="8" min="0">
          </div>
          <div>
            <label class="block font-medium">Tomas (Enchufes)</label>
            <input type="number" id="req-tomas" class="w-full p-2 border rounded mt-1" value="12" min="0">
          </div>
          <div>
            <label class="block font-medium">Picos de Luz Ext.</label>
            <input type="number" id="req-picos" class="w-full p-2 border rounded mt-1" value="4" min="0">
          </div>
          <div>
            <label class="block font-medium">Llaves (Puntos)</label>
            <input type="number" id="req-llaves" class="w-full p-2 border rounded mt-1" value="6" min="0">
          </div>
        </div>
        <button onclick="guardarConfig()" class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">Guardar Estándar</button>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h3 class="font-bold mb-2">Total Edificio (100 Dptos)</h3>
        <div id="resumen-total-edificio" class="grid grid-cols-2 gap-2 text-sm text-gray-700"></div>
      </div>
    </section>

    <!-- PANEL 2: Cargar Uso diario -->
    <section id="sec-uso" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-lg mb-2 text-blue-800">Registrar Material Utilizado</h2>
        
        <div class="space-y-3 text-sm">
          <div>
            <label class="block font-medium">Número de Departamento (1 al 100)</label>
            <input type="number" id="uso-dpto" min="1" max="100" class="w-full p-2 border rounded mt-1" placeholder="Ej: 12">
          </div>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium">Luces Usadas</label>
              <input type="number" id="uso-luces" class="w-full p-2 border rounded mt-1" value="0">
            </div>
            <div>
              <label class="block text-xs font-medium">Tomas Usados</label>
              <input type="number" id="uso-tomas" class="w-full p-2 border rounded mt-1" value="0">
            </div>
            <div>
              <label class="block text-xs font-medium">Picos Usados</label>
              <input type="number" id="uso-picos" class="w-full p-2 border rounded mt-1" value="0">
            </div>
            <div>
              <label class="block text-xs font-medium">Llaves Usadas</label>
              <input type="number" id="uso-llaves" class="w-full p-2 border rounded mt-1" value="0">
            </div>
          </div>

          <button onclick="registrarUso()" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 mt-2">Cargar Uso</button>
        </div>
      </div>
    </section>

    <!-- PANEL 3: Faltantes por Piso -->
    <section id="sec-piso" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-lg mb-2 text-blue-800">Faltantes para Terminar el Piso</h2>
        <label class="block text-sm font-medium mb-1">Seleccionar Piso</label>
        <select id="select-piso" onchange="calcularFaltantePiso()" class="w-full p-2 border rounded mb-4">
          <!-- Opciones cargadas por JS -->
        </select>

        <div id="resultado-piso" class="space-y-2">
          <!-- Resultado renderizado vía JS -->
        </div>
      </div>
    </section>

    <!-- PANEL 4: Stock Global -->
    <section id="sec-global" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h2 class="font-bold text-lg mb-2 text-blue-800">Balance General de la Obra</h2>
        <div id="balance-global" class="space-y-3 text-sm"></div>
      </div>
    </section>

  </main>

  <script>
    const TOTAL_DPTOS = 100;
    const DPTOS_POR_PISO = 10; // Asumiendo 10 pisos de 10 dptos

    let config = JSON.parse(localStorage.getItem('obra_config')) || { luces: 8, tomas: 12, picos: 4, llaves: 6 };
    let uso = JSON.parse(localStorage.getItem('obra_uso')) || {};

    function init() {
      document.getElementById('req-luces').value = config.luces;
      document.getElementById('req-tomas').value = config.tomas;
      document.getElementById('req-picos').value = config.picos;
      document.getElementById('req-llaves').value = config.llaves;

      // Cargar selector de pisos (Piso 1 al 10)
      const selectPiso = document.getElementById('select-piso');
      selectPiso.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        selectPiso.innerHTML += `<option value="${i}">Piso ${i} (Dptos ${ (i-1)*10 + 1 } al ${ i*10 })</option>`;
      }

      actualizarResumenConfig();
      calcularFaltantePiso();
      actualizarGlobal();
    }

    function switchTab(tab) {
      ['config', 'uso', 'piso', 'global'].forEach((t, i) => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab${i+1}`).classList.remove('tab-active');
      });
      
      const tabMap = { 'config': 1, 'uso': 2, 'piso': 3, 'global': 4 };
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab${tabMap[tab]}`).classList.add('tab-active');

      if(tab === 'piso') calcularFaltantePiso();
      if(tab === 'global') actualizarGlobal();
    }

    function guardarConfig() {
      config = {
        luces: parseInt(document.getElementById('req-luces').value) || 0,
        tomas: parseInt(document.getElementById('req-tomas').value) || 0,
        picos: parseInt(document.getElementById('req-picos').value) || 0,
        llaves: parseInt(document.getElementById('req-llaves').value) || 0,
      };
      localStorage.setItem('obra_config', JSON.stringify(config));
      actualizarResumenConfig();
      alert('Configuración guardada.');
    }

    function actualizarResumenConfig() {
      document.getElementById('resumen-total-edificio').innerHTML = `
        <div class="bg-gray-50 p-2 rounded"><b>Luces:</b> ${config.luces * TOTAL_DPTOS}</div>
        <div class="bg-gray-50 p-2 rounded"><b>Tomas:</b> ${config.tomas * TOTAL_DPTOS}</div>
        <div class="bg-gray-50 p-2 rounded"><b>Picos:</b> ${config.picos * TOTAL_DPTOS}</div>
        <div class="bg-gray-50 p-2 rounded"><b>Llaves:</b> ${config.llaves * TOTAL_DPTOS}</div>
      `;
    }

    function registrarUso() {
      const dpto = parseInt(document.getElementById('uso-dpto').value);
      if (!dpto || dpto < 1 || dpto > TOTAL_DPTOS) {
        alert('Ingresá un número de departamento válido (1 al 100).');
        return;
      }

      uso[dpto] = {
        luces: parseInt(document.getElementById('uso-luces').value) || 0,
        tomas: parseInt(document.getElementById('uso-tomas').value) || 0,
        picos: parseInt(document.getElementById('uso-picos').value) || 0,
        llaves: parseInt(document.getElementById('uso-llaves').value) || 0
      };

      localStorage.setItem('obra_uso', JSON.stringify(uso));
      alert(`Uso registrado correctamente para Dpto ${dpto}`);
      document.getElementById('uso-dpto').value = '';
    }

    function calcularFaltantePiso() {
      const piso = parseInt(document.getElementById('select-piso').value);
      const dptoInicio = (piso - 1) * DPTOS_POR_PISO + 1;
      const dptoFin = piso * DPTOS_POR_PISO;

      let acumuladoUso = { luces: 0, tomas: 0, picos: 0, llaves: 0 };

      for (let i = dptoInicio; i <= dptoFin; i++) {
        if (uso[i]) {
          acumuladoUso.luces += uso[i].luces;
          acumuladoUso.tomas += uso[i].tomas;
          acumuladoUso.picos += uso[i].picos;
          acumuladoUso.llaves += uso[i].llaves;
        }
      }

      const totalPisoRequerido = {
        luces: config.luces * DPTOS_POR_PISO,
        tomas: config.tomas * DPTOS_POR_PISO,
        picos: config.picos * DPTOS_POR_PISO,
        llaves: config.llaves * DPTOS_POR_PISO
      };

      const faltante = {
        luces: Math.max(0, totalPisoRequerido.luces - acumuladoUso.luces),
        tomas: Math.max(0, totalPisoRequerido.tomas - acumuladoUso.tomas),
        picos: Math.max(0, totalPisoRequerido.picos - acumuladoUso.picos),
        llaves: Math.max(0, totalPisoRequerido.llaves - acumuladoUso.llaves)
      };

      document.getElementById('resultado-piso').innerHTML = `
        <div class="p-3 bg-red-50 text-red-700 rounded-lg border border-red-200">
          <p class="font-bold text-base border-b border-red-200 pb-1 mb-2">Faltantes Piso ${piso}</p>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div><b>Luces:</b> ${faltante.luces} u.</div>
            <div><b>Tomas:</b> ${faltante.tomas} u.</div>
            <div><b>Picos:</b> ${faltante.picos} u.</div>
            <div><b>Llaves:</b> ${faltante.llaves} u.</div>
          </div>
        </div>
      `;
    }

    function actualizarGlobal() {
      let totalUsado = { luces: 0, tomas: 0, picos: 0, llaves: 0 };
      Object.values(uso).forEach(u => {
        totalUsado.luces += u.luces;
        totalUsado.tomas += u.tomas;
        totalUsado.picos += u.picos;
        totalUsado.llaves += u.llaves;
      });

      const totalEdificio = {
        luces: config.luces * TOTAL_DPTOS,
        tomas: config.tomas * TOTAL_DPTOS,
        picos: config.picos * TOTAL_DPTOS,
        llaves: config.llaves * TOTAL_DPTOS
      };

      document.getElementById('balance-global').innerHTML = `
        <div class="p-3 bg-gray-50 rounded border">
          <p class="font-bold">Luces</p>
          <p class="text-xs text-gray-600">Usado: ${totalUsado.luces} / ${totalEdificio.luces} (Faltan: ${totalEdificio.luces - totalUsado.luces})</p>
        </div>
        <div class="p-3 bg-gray-50 rounded border">
          <p class="font-bold">Tomas</p>
          <p class="text-xs text-gray-600">Usado: ${totalUsado.tomas} / ${totalEdificio.tomas} (Faltan: ${totalEdificio.tomas - totalUsado.tomas})</p>
        </div>
        <div class="p-3 bg-gray-50 rounded border">
          <p class="font-bold">Picos</p>
          <p class="text-xs text-gray-600">Usado: ${totalUsado.picos} / ${totalEdificio.picos} (Faltan: ${totalEdificio.picos - totalUsado.picos})</p>
        </div>
        <div class="p-3 bg-gray-50 rounded border">
          <p class="font-bold">Llaves</p>
          <p class="text-xs text-gray-600">Usado: ${totalUsado.llaves} / ${totalEdificio.llaves} (Faltan: ${totalEdificio.llaves - totalUsado.llaves})</p>
        </div>
      `;
    }

    window.onload = init;
  </script>
</body>
</html>
